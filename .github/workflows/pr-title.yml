name: pr-title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR title
    # Non-production check -> staging-access. Safe for fork PRs: this runs on
    # pull_request_target (the workflow definition comes from main) and never
    # checks out or executes pull request code.
    runs-on: [staging-access]
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          headerPattern: '^([\w ]*)(?:\(([\w$.\-*/ ]*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            memory base
            perf
            refactor
            revert
            style
            test
      - name: Disallow trailing ellipsis
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == *... ]]; then
            echo "::error title=Invalid PR title::PR title must not end with an ellipsis (...)"
            exit 1
          fi
