# Publishes the engine to PyPI as `memu-cli` — the one and only distribution.
#
# `memu-cli` versions independently of the release-please train (which still
# cuts GitHub releases and the changelog), so the npm launcher and docs can
# point at a stable install target; the version is set at build time from the
# workflow input.
#
# First-time setup: add a trusted publisher on PyPI for project `memu-cli`
# (workflow: publish-memu-cli.yml, environment: pypi).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "memu-cli version to publish (e.g. 0.2.1)"
        required: true
        type: string

name: publish-memu-cli

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Stamp the release version into pyproject before building; `$. < 10`
      # scopes the match to the [project] table near the top of the file.
      - name: Set memu-cli version
        shell: bash
        env:
          MEMU_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 -c 'import os, re; assert re.fullmatch(r"[0-9][a-zA-Z0-9.!+_-]*", os.environ["MEMU_RELEASE_VERSION"]), "Invalid version"'
          perl -pi -e 's/^version = "[^"]*"/version = "$ENV{MEMU_RELEASE_VERSION}"/ if $. < 10' pyproject.toml
          grep -q '^name = "memu-cli"' pyproject.toml || { echo "::error::pyproject is not memu-cli"; exit 1; }
          grep -E '^(name|version) = ' pyproject.toml | head -2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # Pure-Python project: one py3-none-any wheel + sdist covers every platform.
      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Smoke test wheel
        shell: bash
        run: uvx --isolated --from ./dist/memu_cli-*.whl memu --help

      - name: Export SDK assets from the release wheel
        shell: bash
        run: |
          wheel=("$PWD"/dist/memu_cli-*.whl)
          uv run --no-project --isolated --with "${wheel[0]}" python scripts/sdk_assets.py export --output dist/sdk-assets --source-commit "$GITHUB_SHA"

      - name: Upload SDK assets artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdk-assets
          path: dist/sdk-assets/
          if-no-files-found: error

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: memu-cli-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish memu-cli to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: memu-cli-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Do not publish instructions from a different wheel when PyPI already
          # owns this version. Retry/correct assets with publish-sdk-assets.yml.
          skip-existing: false

  publish-sdk-assets:
    needs: publish
    if: vars.SDK_ASSETS_BUCKET != ''
    uses: ./.github/workflows/sdk-assets-upload.yml
    secrets: inherit
